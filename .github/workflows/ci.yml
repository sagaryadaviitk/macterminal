name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift Version
        run: swift --version
      - name: Test
        run: swift test
      - name: Package And Verify App
        run: ./scripts/package_app.sh release
